<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 Trading Pattern Quiz</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;
  --border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --green:#3fb950;--red:#f85149;--yellow:#e3b341;
  --blue:#58a6ff;--blue-dim:rgba(88,166,255,.12);
  --green-dim:rgba(63,185,80,.15);--red-dim:rgba(248,81,73,.15);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px}

/* ── HEADER ─────────────────────────── */
.hdr{display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50}
.logo{font-size:17px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:6px}
.logo span{font-size:20px}
.stats{display:flex;gap:10px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:4px 14px;text-align:center;min-width:60px}
.stat-v{font-size:19px;font-weight:800;line-height:1.15}
.stat-v.g{color:var(--green)}.stat-v.y{color:var(--yellow)}.stat-v.b{color:var(--blue)}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ── MAIN ────────────────────────────── */
.main{max-width:940px;margin:0 auto;padding:18px 14px 50px}

/* ── PROGRESS ────────────────────────── */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog-track{flex:1;height:4px;background:#21262d;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),#388bfd);
  border-radius:2px;transition:width .5s ease}
.prog-lbl{font-size:12px;color:var(--muted);white-space:nowrap}

/* ── SCENARIO META ───────────────────── */
.meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pair-row{display:flex;align-items:center;gap:8px}
.pair{font-size:16px;font-weight:700}
.tf-badge{background:#21262d;color:var(--muted);padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.pattern-tag{display:none;background:var(--blue-dim);border:1px solid rgba(88,166,255,.3);
  color:var(--blue);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}

/* ── CHART ───────────────────────────── */
.chart-card{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;margin-bottom:16px}
#chartWrap{width:100%;height:370px}

/* ── QUESTION ────────────────────────── */
.q-section{text-align:center;margin-bottom:14px}
.q-title{font-size:20px;font-weight:700;margin-bottom:5px}
.q-sub{color:var(--muted);font-size:13px;line-height:1.55;max-width:620px;margin:0 auto 16px}

/* ── ACTION BUTTONS ──────────────────── */
.action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.abtn{padding:13px 38px;border-radius:10px;border:none;cursor:pointer;
  font-size:15px;font-weight:700;letter-spacing:.3px;
  transition:transform .15s,box-shadow .15s,opacity .2s}
.abtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.45)}
.abtn:active:not(:disabled){transform:none}
.abtn:disabled{opacity:.4;cursor:not-allowed}
.btn-buy{background:linear-gradient(135deg,#1a7f37,#2ea043);color:#fff}
.btn-hold{background:linear-gradient(135deg,#9e6a03,#d29922);color:#fff}
.btn-sell{background:linear-gradient(135deg,#a40e26,#cf222e);color:#fff}
.btn-next{background:linear-gradient(135deg,#1c48a8,#2563eb);color:#fff;
  display:none;margin:0 auto;padding:13px 44px}
.btn-restart{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;
  display:block;margin:0 auto;padding:13px 44px;border-radius:10px;border:none;
  cursor:pointer;font-size:15px;font-weight:700;letter-spacing:.3px;
  transition:transform .15s,box-shadow .15s}
.btn-restart:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.45)}

/* ── RESULT PANEL ────────────────────── */
.result{display:none;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:18px 20px;margin-bottom:14px;
  animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result-hdr{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.result-ico{font-size:34px;flex-shrink:0;margin-top:2px}
.result-title{font-size:19px;font-weight:700}
.correct-title{color:var(--green)}.incorrect-title{color:var(--red)}.partial-title{color:var(--yellow)}
.result-body{color:#c9d1d9;font-size:13.5px;line-height:1.7}
.result-body strong{color:var(--text)}
.concepts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.concept{display:inline-flex;align-items:center;gap:4px;
  background:var(--blue-dim);border:1px solid rgba(88,166,255,.22);
  color:var(--blue);padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600}
.outcome-strip{background:var(--surface2);border-radius:8px;padding:10px 14px;
  margin-top:12px;font-size:13px;color:var(--muted)}
.outcome-strip b{color:var(--text)}

/* ── FINAL SCREEN ────────────────────── */
#finalScreen{display:none;text-align:center;padding:40px 20px}
.final-ring{width:150px;height:150px;border-radius:50%;
  background:linear-gradient(145deg,var(--surface),var(--surface2));
  border:4px solid var(--blue);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto 22px}
.final-num{font-size:46px;font-weight:800;color:var(--blue);line-height:1}
.final-denom{font-size:14px;color:var(--muted)}
.final-grade{font-size:26px;font-weight:700;margin-bottom:8px}
.final-sub{color:var(--muted);font-size:14px;max-width:400px;margin:0 auto 24px}
.breakdown{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.bk-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 18px;text-align:center;min-width:90px}
.bk-num{font-size:22px;font-weight:700}
.bk-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ── MISC ────────────────────────────── */
.badge-correct{display:inline-block;background:var(--green-dim);border:1px solid rgba(63,185,80,.3);
  color:var(--green);padding:2px 8px;border-radius:5px;font-size:12px;font-weight:600}
.badge-wrong{display:inline-block;background:var(--red-dim);border:1px solid rgba(248,81,73,.3);
  color:var(--red);padding:2px 8px;border-radius:5px;font-size:12px;font-weight:600}
.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
@media(max-width:560px){
  .abtn{padding:12px 22px;font-size:14px}
  #chartWrap{height:290px}
  .stats{gap:6px}.stat{padding:4px 10px;min-width:50px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo"><span>📈</span> Trading Pattern Quiz</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-v g" id="scoreDisp">0</div>
      <div class="stat-l">Score</div>
    </div>
    <div class="stat">
      <div class="stat-v y" id="streakDisp">0</div>
      <div class="stat-l">Streak 🔥</div>
    </div>
    <div class="stat">
      <div class="stat-v b" id="qDisp">1/8</div>
      <div class="stat-l">Round</div>
    </div>
  </div>
</header>

<!-- QUIZ SCREEN -->
<div id="quizScreen">
<main class="main">

  <!-- Progress -->
  <div class="prog-row">
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-lbl" id="progLbl">Scenario 1 of 8</div>
  </div>

  <!-- Meta -->
  <div class="meta-row">
    <div class="pair-row">
      <span class="pair" id="pairDisp">BTC / USD</span>
      <span class="tf-badge" id="tfDisp">4H</span>
    </div>
    <span class="pattern-tag" id="patternTag">Bull Flag</span>
  </div>

  <!-- Chart -->
  <div class="chart-card">
    <div id="chartWrap"></div>
  </div>

  <!-- Question -->
  <div class="q-section">
    <h2 class="q-title">What would you do here?</h2>
    <p class="q-sub" id="qContext">Loading scenario…</p>
    <div class="action-row">
      <button class="abtn btn-buy"  onclick="answer('buy')" id="btnBuy">🟢 BUY</button>
      <button class="abtn btn-hold" onclick="answer('hold')" id="btnHold">🟡 HOLD</button>
      <button class="abtn btn-sell" onclick="answer('sell')" id="btnSell">🔴 SELL</button>
    </div>
  </div>

  <!-- Result (revealed after answer) -->
  <div class="result" id="resultPanel">
    <div class="result-hdr">
      <div class="result-ico" id="resIco">🎯</div>
      <div>
        <div class="result-title" id="resTitle">Correct!</div>
        <div style="margin-top:4px" id="resPatternLabel"></div>
      </div>
    </div>
    <hr class="sep">
    <div class="result-body" id="resBody"></div>
    <div class="outcome-strip" id="resOutcome"></div>
    <div class="concepts" id="resConcepts"></div>
  </div>

  <!-- Next button -->
  <button class="abtn btn-next" id="btnNext" onclick="nextScenario()">Next Scenario →</button>

</main>
</div>

<!-- FINAL SCREEN -->
<div id="finalScreen">
<main class="main">
  <div style="max-width:520px;margin:0 auto">
    <h1 style="font-size:28px;font-weight:800;margin-bottom:6px">Quiz Complete! 🏁</h1>
    <p style="color:var(--muted);margin-bottom:24px">Here's how you performed across all 8 scenarios</p>
    <div class="final-ring">
      <div class="final-num" id="finalScore">0</div>
      <div class="final-denom" id="finalDenom">/ 8</div>
    </div>
    <div class="final-grade" id="finalGrade">Loading…</div>
    <p class="final-sub" id="finalSub"></p>
    <div class="breakdown">
      <div class="bk-item">
        <div class="bk-num g" id="bkCorrect" style="color:var(--green)">0</div>
        <div class="bk-lbl">Correct</div>
      </div>
      <div class="bk-item">
        <div class="bk-num" id="bkWrong" style="color:var(--red)">0</div>
        <div class="bk-lbl">Wrong</div>
      </div>
      <div class="bk-item">
        <div class="bk-num" id="bkStreak" style="color:var(--yellow)">0</div>
        <div class="bk-lbl">Best Streak</div>
      </div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">🔄 Play Again</button>
  </div>
</main>
</div>

// ════════════════════════════════════════════════════════════
//  QUIZ STATE
// ════════════════════════════════════════════════════════════

let order = [];
let idx = 0;
let score = 0;
let streak = 0;
let bestStreak = 0;
let wrong = 0;
let answered = false;
let chartInstance = null;
let candleSeries = null;
let volSeries = null;
let revealTimer = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function addDays(base, n) {
  const d = new Date(base);
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function buildChartData(raw, base, offset = 0) {
  const candles = [], vols = [];
  raw.forEach(([o, h, l, c, v], i) => {
    const t = addDays(base, offset + i);
    candles.push({ time: t, open: o, high: h, low: l, close: c });
    vols.push({ time: t, value: v, color: c >= o ? 'rgba(38,166,65,.55)' : 'rgba(248,81,73,.55)' });
  });
  return { candles, vols };
}

// ════════════════════════════════════════════════════════════
//  CHART INIT
// ════════════════════════════════════════════════════════════

function initChart(sc) {
  const wrap = document.getElementById('chartWrap');
  wrap.innerHTML = '';

  chartInstance = LightweightCharts.createChart(wrap, {
    width: wrap.clientWidth,
    height: wrap.clientHeight || 370,
    layout: {
      background: { type: 'solid', color: '#161b22' },
      textColor: '#8b949e',
    },
    grid: {
      vertLines: { color: '#1e242c' },
      horzLines: { color: '#1e242c' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#30363d', scaleMargins: { top: 0.05, bottom: 0.22 } },
    timeScale: { borderColor: '#30363d', timeVisible: true, fixLeftEdge: true, fixRightEdge: true },
    handleScroll: false,
    handleScale: false,
  });

  candleSeries = chartInstance.addCandlestickSeries({
    upColor: '#26a641', downColor: '#f85149',
    borderUpColor: '#2ea043', borderDownColor: '#f85149',
    wickUpColor: '#26a641', wickDownColor: '#f85149',
  });

  volSeries = chartInstance.addHistogramSeries({
    priceFormat: { type: 'volume' },
    priceScaleId: 'vol',
    lastValueVisible: false,
    priceLineVisible: false,
  });
  chartInstance.priceScale('vol').applyOptions({
    scaleMargins: { top: 0.82, bottom: 0 },
  });

  const { candles, vols } = buildChartData(sc.setup, sc.baseDate);
  candleSeries.setData(candles);
  volSeries.setData(vols);

  // Add key levels
  sc.levels.forEach(lv => {
    candleSeries.createPriceLine({
      price: lv.price, color: lv.color, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: lv.title,
    });
  });

  // "You Are Here" marker on last candle
  const lastTime = candles[candles.length - 1].time;
  candleSeries.setMarkers([{
    time: lastTime, position: 'aboveBar',
    color: '#e3b341', shape: 'arrowDown', text: '← You Are Here',
  }]);

  chartInstance.timeScale().fitContent();

  window._resizeChart = () => {
    if (chartInstance) chartInstance.resize(wrap.clientWidth, wrap.clientHeight || 370);
  };
  window.addEventListener('resize', window._resizeChart);
}

// ════════════════════════════════════════════════════════════
//  REVEAL CANDLES
// ════════════════════════════════════════════════════════════

function animateReveal(sc) {
  candleSeries.setMarkers([]); // remove "you are here"
  const offset = sc.setup.length;
  let i = 0;

  function step() {
    if (i >= sc.reveal.length) return;
    const [o, h, l, c, v] = sc.reveal[i];
    const t = addDays(sc.baseDate, offset + i);
    candleSeries.update({ time: t, open: o, high: h, low: l, close: c });
    volSeries.update({ time: t, value: v, color: c >= o ? 'rgba(38,166,65,.55)' : 'rgba(248,81,73,.55)' });
    i++;
    revealTimer = setTimeout(step, 140);
  }
  step();
}

// ════════════════════════════════════════════════════════════

function loadScenario() {
  if (revealTimer) clearTimeout(revealTimer);
  answered = false;

  const sc = SCENARIOS[order[idx]];
  const total = SCENARIOS.length;

  // Progress
  const pct = (idx / total) * 100;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLbl').textContent = `Scenario ${idx + 1} of ${total}`;

  // Meta
  document.getElementById('pairDisp').textContent = sc.pair;
  document.getElementById('tfDisp').textContent = sc.tf;
  document.getElementById('patternTag').style.display = 'none';

  // Question
  document.getElementById('qContext').textContent = sc.context;

  // Buttons
  ['btnBuy', 'btnHold', 'btnSell'].forEach(id => {
    const b = document.getElementById(id);
    b.disabled = false;
    b.style.opacity = '';
    b.style.boxShadow = '';
  });

  // Hide result + next
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('btnNext').style.display = 'none';

  // Update header
  document.getElementById('scoreDisp').textContent = score;
  document.getElementById('streakDisp').textContent = streak;
  document.getElementById('qDisp').textContent = `${idx + 1}/${total}`;

  // Chart
  initChart(sc);
}

// ════════════════════════════════════════════════════════════
//  ANSWER HANDLER
// ════════════════════════════════════════════════════════════

function answer(choice) {
  if (answered) return;
  answered = true;

  const sc = SCENARIOS[order[idx]];
  const isCorrect = choice === sc.correct;

  // Disable buttons, highlight
  ['buy', 'hold', 'sell'].forEach(c => {
    const b = document.getElementById('btn' + c.charAt(0).toUpperCase() + c.slice(1));
    b.disabled = true;
    if (c === sc.correct) {
      b.style.opacity = '1';
      b.style.boxShadow = '0 0 0 3px rgba(63,185,80,.6)';
    } else if (c === choice && !isCorrect) {
      b.style.opacity = '1';
      b.style.boxShadow = '0 0 0 3px rgba(248,81,73,.6)';
    } else {
      b.style.opacity = '0.3';
    }
  });

  // Score
  if (isCorrect) {
    score++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
  } else {
    streak = 0;
    wrong++;
  }

  document.getElementById('scoreDisp').textContent = score;
  document.getElementById('streakDisp').textContent = streak;

  // Show pattern tag
  const tag = document.getElementById('patternTag');
  tag.textContent = sc.patternName;
  tag.style.display = 'inline-block';

  // Result panel
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';

  let ico, titleText, titleClass;
  if (isCorrect) {
    ico = '🎯'; titleText = 'Correct!'; titleClass = 'correct-title';
  } else if (choice === 'hold') {
    ico = '⚠️'; titleText = 'Close — but the better move was ' + sc.correct.toUpperCase(); titleClass = 'partial-title';
  } else {
    ico = '❌'; titleText = `Wrong — the correct move was ${sc.correct.toUpperCase()}`; titleClass = 'incorrect-title';
  }

  document.getElementById('resIco').textContent = ico;
  const rt = document.getElementById('resTitle');
  rt.textContent = titleText;
  rt.className = 'result-title ' + titleClass;

  document.getElementById('resPatternLabel').innerHTML =
    `<span class="${isCorrect ? 'badge-correct' : 'badge-wrong'}">Pattern: ${sc.patternName}</span>`;

  document.getElementById('resBody').innerHTML = sc.explanation;
  document.getElementById('resOutcome').innerHTML = `📊 <b>What happened next:</b> ${sc.outcomeText}`;

  const cDiv = document.getElementById('resConcepts');
  cDiv.innerHTML = sc.concepts.map(c => `<span class="concept">📚 ${c}</span>`).join('');

  // Show next button
  document.getElementById('btnNext').style.display = 'block';

  // Animate reveal
  setTimeout(() => animateReveal(sc), 300);
}

// ════════════════════════════════════════════════════════════
//  NEXT / RESTART
// ════════════════════════════════════════════════════════════

function nextScenario() {
  if (window._resizeChart) window.removeEventListener('resize', window._resizeChart);
  idx++;
  if (idx >= SCENARIOS.length) {
    showFinal();
  } else {
    loadScenario();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showFinal() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('finalScreen').style.display = 'block';

  const total = SCENARIOS.length;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalDenom').textContent = '/ ' + total;
  document.getElementById('bkCorrect').textContent = score;
  document.getElementById('bkWrong').textContent = wrong;
  document.getElementById('bkStreak').textContent = bestStreak;

  const pct = score / total;
  let grade, sub;
  if (pct === 1)       { grade = '🏆 Expert Trader';       sub = 'Perfect score! You\'ve mastered market structure, patterns, and price action from the course. Chart time is paying off.'; }
  else if (pct >= .875){ grade = '📈 Senior Trader';        sub = 'Excellent! You\'re reading the market at a high level. Keep refining your edge with journaling and screen time.'; }
  else if (pct >= .75) { grade = '🎯 Intermediate Trader';  sub = 'Solid foundation. You recognize most patterns — focus on the ones you missed and revisit the LTE methodology.'; }
  else if (pct >= .5)  { grade = '📚 Learning Trader';      sub = 'Good start. The patterns take time to internalize. Review the course modules on chart patterns and candlestick formations.'; }
  else                 { grade = '🌱 Apprentice Trader';     sub = 'Keep studying! Review Course 1 (Market Structure) and Course 2 (Chart Patterns). Screen time is the key — put in the reps.'; }

  document.getElementById('finalGrade').textContent = grade;
  document.getElementById('finalSub').textContent = sub;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  if (revealTimer) clearTimeout(revealTimer);
  if (chartInstance) { chartInstance.remove(); chartInstance = null; }
  score = 0; streak = 0; bestStreak = 0; wrong = 0; idx = 0;
  order = shuffle(SCENARIOS.map((_, i) => i));
  document.getElementById('quizScreen').style.display = '';
  document.getElementById('finalScreen').style.display = 'none';
  loadScenario();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════════
order = shuffle(SCENARIOS.map((_, i) => i));
loadScenario();

</script>
