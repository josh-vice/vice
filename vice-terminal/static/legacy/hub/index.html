<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vice Hub — your live market dashboard</title>
  <link rel="icon" type="image/png" href="../vice-terminal-64.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />

  <meta name="description" content="Vice Hub: a customizable live market dashboard built to sit open on a second monitor. Drag, resize and configure chart, heatmap, screener, news and watchlist blocks. Free, no account — layouts save in your browser." />
  <link rel="canonical" href="https://vicesuite.com/hub" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vice Terminal" />
  <meta property="og:title" content="Vice Hub — your live market dashboard" />
  <meta property="og:description" content="A customizable canvas of live market widgets: charts, heatmaps, screeners, news, watchlists. Drag it into your own layout — it saves locally, no account." />
  <meta property="og:url" content="https://vicesuite.com/hub" />
  <meta property="og:image" content="https://vicesuite.com/apple-touch-icon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="https://vicesuite.com/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../vice.css?v=2.7.1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@12.6.0/dist/gridstack.min.css"
        integrity="sha384-v0+pyCGvaIDMe1HS4sAK/N5W4dvvEUFvTvAW9CmGumaXgHxaYO56Ow3DULWhd/kO"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="../hub.css?v=1.41.0" />

  <script src="https://cdn.jsdelivr.net/npm/lucide@1.23.0/dist/umd/lucide.min.js"
          integrity="sha384-ouAVEJVCMsf8Svzn+BwqbaBhxBEA0xgeVBhHnxmWd+Wqyv18yhWCQwGegFD/OHLq"
          crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gridstack@12.6.0/dist/gridstack-all.js"
          integrity="sha384-1/7H0y8C8vVEG2on7YuZQxUTtB+qMc+96SMFWVVl+0T6UVSVkgHg16yRwYVTFFoP"
          crossorigin="anonymous" defer></script>
  <!-- ECharts + the chart-bot engine (demo.js exports ViceChartEngine; its
       demo UI only boots on /chartbot) — powers the native Vice Chart widget -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"
          integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss"
          crossorigin="anonymous" defer></script>
  <script type="module" src="../demo.js?v=1.3.0"></script>
  <script src="../vchart.js?v=1.10.0" defer></script>
  <script src="../hub-persistence.js" defer></script>
  <script src="../suite-bridge.js" defer></script>
  <script src="../hub.js?v=2.25.0" defer></script>
  <script src="../vice.js?v=1.2.0" defer></script>
</head>
<body class="hub-page">

  <main class="hub-main">
    <div class="hub-bar">
      <a class="hub-brand" href="https://vicesuite.com/" title="The Vice Suite">
        <span class="vt-flamingo" role="img" aria-label="Vice Terminal"></span>
      </a>
      <a class="hub-bar-title" href="#/" title="Back to the dashboard">Vice <strong>Hub</strong></a>
      <nav id="hub-nav" class="hub-nav" aria-label="Hub sections">
        <a href="#/" data-sec="dash" title="Your customizable dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
        <a href="#/chart" data-sec="chart" title="Full-page charting"><i data-lucide="candlestick-chart"></i><span>Chart</span></a>
        <a href="#/scanner" data-sec="scanner" title="Vice Scanner — track the top Hyperliquid wallets"><i data-lucide="radar"></i><span>Scanner</span></a>
        <a href="#/gallery" data-sec="gallery" title="Every element, live-previewable"><i data-lucide="shapes"></i><span>Gallery</span></a>
        <a href="https://liqtheory.com/academy" title="Vice Academy — the full Liquidity Theory course, free"><i data-lucide="book-open"></i><span>Academy</span></a>
      </nav>
      <span class="spacer"></span>
      <span class="hub-menu-wrap" id="hub-layout-wrap">
        <button id="hub-layout" class="hub-btn hub-layout-btn" type="button" title="Switch layout (1–5)" aria-haspopup="menu" aria-expanded="false"><i data-lucide="layout-grid"></i><span id="hub-layout-name">—</span><i data-lucide="chevron-down" class="chev"></i></button>
        <div id="hub-layout-menu" class="hub-menu" role="menu" aria-label="Layouts"></div>
      </span>
      <button id="hub-add" class="hub-btn edit-only" type="button" title="Add a widget"><i data-lucide="plus"></i><span>Add widget</span></button>
      <button id="hub-tidy" class="hub-btn edit-only" type="button" title="Tidy — pack the grid and trim blank space"><i data-lucide="wand-2"></i><span>Tidy</span></button>
      <button id="hub-edit" class="hub-btn" type="button" title="Customize the layout — drag, resize, add (E)"><i data-lucide="pencil"></i><span>Customize</span></button>
      <span class="hub-div" id="hub-div-dash"></span>
      <button id="hub-focus" class="hub-btn" type="button" title="Focus on one ticker (F)"><i data-lucide="crosshair"></i><span>Focus</span></button>
      <span id="hub-suite-context" class="hub-suite-context" aria-live="polite">Suite context: waiting</span>
      <button id="hub-open-trade" class="hub-btn" type="button" title="Open the exact Suite trade context" disabled><i data-lucide="arrow-right"></i><span>Trade</span></button>
      <button id="hub-pal" class="hub-btn" type="button" title="Search &amp; commands (⌘K)"><i data-lucide="search"></i><span class="kbd">⌘K</span></button>
      <span class="hub-div"></span>
      <span class="hub-menu-wrap">
        <button id="hub-more" class="hub-btn" type="button" title="Layout options"><i data-lucide="more-vertical"></i></button>
        <div id="hub-menu" class="hub-menu">
          <button data-menu="new" type="button"><i data-lucide="file-plus-2"></i>New layout…</button>
          <button data-menu="dup" type="button"><i data-lucide="copy"></i>Duplicate current</button>
          <button data-menu="rename" type="button"><i data-lucide="pen-line"></i>Rename…</button>
          <div class="sep"></div>
          <button data-menu="export" type="button"><i data-lucide="download"></i>Export this layout</button>
          <button data-menu="exportall" type="button"><i data-lucide="archive"></i>Export all layouts</button>
          <label><i data-lucide="upload"></i>Import from JSON<input id="hub-import" type="file" accept="application/json,.json" style="display:none;" /></label>
          <div id="hub-backup-hint" class="hub-menu-hint"></div>
          <div class="sep"></div>
          <button data-menu="keys" type="button"><i data-lucide="keyboard"></i>Keyboard shortcuts</button>
          <div class="sep"></div>
          <a href="https://vicesuite.com/"><i data-lucide="layout-grid"></i>The Vice Suite</a>
          <a href="https://vicesuite.com/pricebots"><i data-lucide="activity"></i>Vice Tickers</a>
          <a href="https://vicesuite.com/chartbot"><i data-lucide="bar-chart-2"></i>Vice Charts</a>
          <a href="https://liqtheory.com/academy"><i data-lucide="book-open"></i>Vice Academy</a>
          <div class="sep"></div>
          <button data-menu="reset" type="button"><i data-lucide="rotate-ccw"></i>Reset to default</button>
          <button data-menu="delete" class="danger" type="button"><i data-lucide="trash-2"></i>Delete layout…</button>
        </div>
      </span>
    </div>

    <div id="hub-grid" class="grid-stack"></div>
    <div id="hub-section" class="hub-sec" hidden></div>
    <div id="hub-empty" class="hub-empty" hidden>
      <i data-lucide="layout-dashboard"></i>
      <p>This layout is empty.</p>
      <button id="hub-empty-add" class="hub-btn primary" type="button"><i data-lucide="plus"></i>Add your first widget</button>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap foot-inner">
      <span class="vt-flamingo" role="img" aria-label="Vice Terminal"></span>
      <span>Vice Hub — layouts live in your browser. No account, nothing leaves your machine.</span>
      <span class="foot-links"><a href="https://vicesuite.com/">Suite</a> <a href="https://vicesuite.com/pricebots">Tickers</a> <a href="https://vicesuite.com/chartbot">Charts</a> <a href="https://liqtheory.com/" target="_blank" rel="noopener noreferrer">Academy</a> <a href="https://discord.gg/LiquidityTheory" target="_blank" rel="noopener noreferrer">Discord</a></span>
    </div>
  </footer>

</body>
</html>
