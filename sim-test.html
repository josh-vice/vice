<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulator Test</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="lt-simulator.js?v=7"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      padding: 16px;
    }
    #topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    #topbar h2 {
      font-size: 1.25rem;
    }
    #regen {
      background: #111;
      color: #00d4d4;
      border: 1px solid #00d4d4;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
    }
    #regen:hover {
      background: #00d4d4;
      color: #000;
    }
    .pattern-label {
      color: #00d4d4;
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 18px;
      margin-bottom: 2px;
    }
    .pattern-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 0;
    }
    .chart-cell {
      display: inline-block;
      width: 320px;
      height: 220px;
      margin: 4px;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <h2>Simulator Test</h2>
    <button id="regen">Regenerate (new seeds)</button>
  </div>
  <div id="grid"></div>

  <script>
    const PATTERNS = [
      'uptrend', 'downtrend', 'range',
      'bull_flag', 'bear_flag', 'breakout',
      'double_top', 'double_bottom',
      'demand_bounce', 'supply_reject',
      'reversal_hammer', 'shooting_star',
      'inverted_hammer', 'doji', 'sr_flip', 'liquidity_sweep', 'bos'
    ];

    // Finest → coarsest: candle count must strictly decrease left → right
    const TFS = ['4h', '6h', '12h', '1d'];

    // Track ECharts instances so we can dispose on re-render
    var _instances = [];

    function render(seedBase) {
      // Dispose old instances
      _instances.forEach(function(inst) { try { inst.dispose(); } catch(e) {} });
      _instances = [];

      var grid = document.getElementById('grid');
      grid.innerHTML = '';

      PATTERNS.forEach(function(pattern, p) {
        // Generate the single source-of-truth base market ONCE per pattern
        var market = generateMarket(pattern, seedBase + p + 1);

        // Pattern label row
        var label = document.createElement('div');
        label.className = 'pattern-label';
        label.textContent = pattern;
        grid.appendChild(label);

        // Flex row of four charts
        var row = document.createElement('div');
        row.className = 'pattern-row';
        grid.appendChild(row);

        // View the same market at each timeframe — pure re-bucketing, no new randomness
        TFS.forEach(function(tf) {
          var data = viewMarket(market, tf);

          var cell = document.createElement('div');
          cell.className = 'chart-cell';
          row.appendChild(cell);

          var chart = echarts.init(cell);
          _instances.push(chart);

          chart.setOption({
            backgroundColor: '#0a0a0a',
            title: {
              text: pattern + ' \u2014 ' + tf + ' (' + data.ohlc.length + ' candles)',
              textStyle: { color: '#888', fontSize: 10 },
              left: 4,
              top: 2
            },
            grid: { left: 46, right: 10, top: 28, bottom: 20 },
            xAxis: {
              type: 'category',
              data: data.labels,
              axisLabel: { color: '#555', fontSize: 8 },
              axisLine: { lineStyle: { color: '#222' } }
            },
            yAxis: {
              scale: true,
              axisLabel: { color: '#555', fontSize: 8 },
              splitLine: { lineStyle: { color: '#161616' } }
            },
            series: [{
              type: 'candlestick',
              data: data.ohlc,
              barMaxWidth: 6,
              itemStyle: {
                color: '#00d4d4',
                color0: '#cc2222',
                borderColor: '#00d4d4',
                borderColor0: '#cc2222'
              },
              markLine: {
                symbol: ['none', 'none'],
                silent: true,
                data: [
                  [
                    {
                      yAxis: data.markLines[0].yAxis,
                      label: {
                        show: true,
                        formatter: data.markLines[0].label,
                        color: '#00d4d4',
                        fontSize: 9,
                        position: 'end'
                      },
                      lineStyle: { color: '#00d4d4', type: 'dashed', width: 1 }
                    },
                    { yAxis: data.markLines[0].yAxis }
                  ],
                  [
                    {
                      xAxis: data.cutIndex,
                      label: {
                        show: true,
                        formatter: 'Decision',
                        color: '#e0b020',
                        fontSize: 9,
                        position: 'insideEndTop'
                      },
                      lineStyle: { color: '#e0b020', type: 'dashed', width: 1 }
                    },
                    { xAxis: data.cutIndex }
                  ]
                ]
              }
            }]
          });
        });
      });
    }

    render(1);

    document.getElementById('regen').addEventListener('click', function() {
      render(Math.floor(Math.random() * 1000));
    });
  </script>
</body>
</html>
