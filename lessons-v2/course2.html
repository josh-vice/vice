<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquidity Theory · v2 — Course 2: Building Your Toolbox</title>
<!-- ISOLATED hub. Loads ONLY the v2 stack + Course 2 lessons; live site untouched.
     All 17 module scripts are listed; not-yet-authored ones 404 harmlessly and the nav
     is built only from registered lessons, so new modules appear with no hub edit. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="player.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #050409; color: #e8e8f0;
    font-family: 'Geist Mono', ui-monospace, Menlo, monospace; }
  .wrap { display: grid; grid-template-columns: 270px 1fr; gap: 24px; max-width: 1320px; margin: 0 auto; padding: 28px 20px 80px; }
  .side h1 { font-size: 15px; margin: 0 0 2px; }
  .side .crumb { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #00d4d4; margin-bottom: 16px; }
  .nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .nav button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: baseline;
    font-family: inherit; font-size: 12.5px; color: #b9b7cc; background: transparent;
    border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; transition: .15s; }
  .nav button:hover { background: #0d0b18; color: #e8e8f0; }
  .nav button.on { background: #14121f; border-color: #272240; color: #fff; }
  .nav button.on .n { color: #00d4d4; }
  .nav .n { color: #6f6c85; font-weight: 700; min-width: 18px; }
  .main { min-width: 0; }
  .mhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 2px 0 14px; }
  .mhead .badge { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #050409; background: #00d4d4; padding: 3px 8px; border-radius: 4px; font-weight: 700; }
  .mhead .t { font-size: 16px; font-weight: 700; }
  .mhead .meta { font-size: 11px; color: #6f6c85; margin-left: auto; }
  .hint { margin-top: 14px; font-size: 12px; color: #6f6c85; text-align: center; }
  .hint kbd { background: #14121f; border: 1px solid #272240; border-radius: 4px; padding: 1px 6px; color: #cfcee0; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <aside class="side">
      <div class="crumb">Course 2</div>
      <h1>Building Your Toolbox</h1>
      <ul class="nav" id="nav"></ul>
    </aside>
    <main class="main">
      <div class="mhead">
        <span class="badge">v2 preview</span>
        <span class="t" id="mtitle">—</span>
        <span class="meta" id="mmeta"></span>
      </div>
      <div id="mount"></div>
      <p class="hint"><kbd>←</kbd>/<kbd>→</kbd> step beats · <kbd>Space</kbd> play/pause · click the stage to advance</p>
    </main>
  </div>

  <script src="chart-vocabulary.js"></script>
  <script src="renderer.js"></script>
  <!-- Course 2 lessons (each registers into window.LT_LESSONS) -->
  <script src="lessons/Course2/01_Trading_Styles.js"></script>
  <script src="lessons/Course2/02_Introduction.js"></script>
  <script src="lessons/Course2/03_Types_of_Trades.js"></script>
  <script src="lessons/Course2/04_Entering_Trades.js"></script>
  <script src="lessons/Course2/05_Exiting_Trades.js"></script>
  <script src="lessons/Course2/06_Price_Action_Formations.js"></script>
  <script src="lessons/Course2/07_Price_Action_Examples.js"></script>
  <script src="lessons/Course2/08_Volume_Analysis.js"></script>
  <script src="lessons/Course2/09_Volume_Examples.js"></script>
  <script src="lessons/Course2/10_Classical_Chart_Patterns.js"></script>
  <script src="lessons/Course2/11_Classical_Pattern_Examples.js"></script>
  <script src="lessons/Course2/12_Fibonacci.js"></script>
  <script src="lessons/Course2/13_Ichimoku_Kinko_Hyo.js"></script>
  <script src="lessons/Course2/14_Ichimoku_Market_Scenario.js"></script>
  <script src="lessons/Course2/15_Oscillators.js"></script>
  <script src="lessons/Course2/16_Financial_Instruments.js"></script>
  <script src="lessons/Course2/17_Outro.js"></script>
  <script>
    (function () {
      var all = window.LT_LESSONS || {};
      var ids = Object.keys(all).filter(function (k) { return k.indexOf('course2/') === 0; }).sort();
      var nav = document.getElementById('nav');
      var player = null;
      function typeCounts(b) { var t = { CONCEPT: 0, CHART: 0, CANDLE: 0 }; b.forEach(function (x) { t[x.type] = (t[x.type] || 0) + 1; }); return t.CONCEPT + ' concept · ' + t.CHART + ' chart · ' + t.CANDLE + ' candle'; }
      function load(id) {
        var lesson = all[id]; if (!lesson) return;
        if (player) player.destroy();
        document.getElementById('mount').innerHTML = '';
        player = window.__player = new LTRenderer(document.getElementById('mount'), lesson);
        document.getElementById('mtitle').textContent = lesson.title;
        document.getElementById('mmeta').textContent = lesson.beats.length + ' beats — ' + typeCounts(lesson.beats);
        location.hash = id;
        Array.prototype.forEach.call(nav.querySelectorAll('button'), function (btn) { btn.classList.toggle('on', btn.dataset.id === id); });
        console.log('[v2] loaded', id, '·', lesson.beats.length, 'beats');
      }
      ids.forEach(function (id) {
        var lesson = all[id];
        var num = (lesson.module || '').slice(0, 2);
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.dataset.id = id;
        btn.innerHTML = '<span class="n">' + num + '</span><span>' + lesson.title + '</span>';
        btn.addEventListener('click', function () { load(id); });
        li.appendChild(btn); nav.appendChild(li);
      });
      var start = (location.hash || '').replace('#', '');
      load(all[start] ? start : ids[0]);
      console.log('[v2] Course 2 hub:', ids.length, 'modules registered');
    })();
  </script>
</body>
</html>
