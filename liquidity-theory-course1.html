<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquidity Theory — Course 1: Laying the Foundation</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --bg2:       #0f0f1a;
      --bg3:       #13131f;
      --bg4:       #1a1a2e;
      --border:    #252538;
      --border2:   #353550;
      --teal:      #00d4d4;
      --teal-dim:  rgba(0,212,212,0.10);
      --teal-glow: rgba(0,212,212,0.25);
      --bull:      #00d4d4;
      --bear:      #cc2222;
      --bear-dim:  rgba(204,34,34,0.10);
      --gold:      #d4a017;
      --gold-dim:  rgba(212,160,23,0.10);
      --text:      #e8eaf6;
      --text-dim:  #8890b0;
      --text-faint:#40406a;
      --radius:    12px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.65;
    }

    #app { max-width: 900px; margin: 0 auto; padding: 0 16px 120px; }

    /* ── HEADER ── */
    #hdr {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px 10px;
      margin: 0 -16px 4px;
    }
    .hdr-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .brand { font-size:.95rem; font-weight:900; letter-spacing:3px; color:var(--teal); text-transform:uppercase; text-shadow:0 0 20px var(--teal-glow); }
    .chap-lbl { font-size:.75rem; color:var(--text-dim); letter-spacing:.5px; }
    .prog-track { height:2px; background:var(--border); border-radius:2px; overflow:hidden; }
    .prog-fill  { height:100%; background:linear-gradient(90deg,var(--teal),#00aaff); border-radius:2px; transition:width .4s ease; }
    .step-dots  { display:flex; gap:6px; justify-content:center; margin-top:8px; }
    .step-dot   { width:7px; height:7px; border-radius:50%; background:var(--border2); transition:all .2s; }

    @keyframes dotPulse {
      0%,100% { box-shadow:0 0 8px rgba(0,212,212,0.25); transform:scale(1.3); }
      50% { box-shadow:0 0 18px rgba(0,212,212,0.55); transform:scale(1.6); }
    }
    .step-dot.active { background:var(--teal); animation:dotPulse 2s ease-in-out infinite; }

    .step-dot.done { background:transparent; border:1.5px solid var(--teal); opacity:.8; position:relative; display:flex; align-items:center; justify-content:center; }
    .step-dot.done::after { content:'✓'; font-size:5px; color:var(--teal); font-weight:900; }

    /* ── PANELS ── */
    .panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px 28px;
      margin: 18px 0 14px;
      position: relative;
      animation: fadeIn .28s ease;
    }
    .panel-icon {
      position:absolute; top:-14px; left:20px;
      background:var(--bg); padding:0 8px; font-size:1.25rem;
    }
    .panel-tag {
      display:inline-block; font-size:.68rem; font-weight:700;
      letter-spacing:1.8px; text-transform:uppercase;
      color:var(--teal); border:1px solid var(--teal);
      border-radius:4px; padding:2px 8px; margin-bottom:12px;
    }
    .panel-tag.gold { color:var(--gold); border-color:var(--gold); }
    .panel-tag.bear { color:var(--bear); border-color:var(--bear); }
    .panel-title { font-size:1.75rem; font-weight:700; line-height:1.3; margin-bottom:14px; }
    .panel-body { font-size:.93rem; color:#c4c6e0; line-height:1.85; }
    .panel-body p { margin-bottom:13px; }
    .panel-body p:last-child { margin-bottom:0; }
    .hl      { color:var(--teal); font-weight:600; background: rgba(0,212,212,0.1); padding: 1px 7px; border-radius: 8px; }
    .hl-gold { color:var(--gold); font-weight:600; }
    .hl-bear { color:var(--bear); font-weight:600; }

    /* ── CHART ── */
    .chart-wrap {
      background: #111318;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden; margin-bottom:14px;
      animation: fadeIn .28s ease;
      box-shadow: 0 0 24px rgba(0,212,212,0.12);
    }
    .chart-topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:9px 16px; border-bottom:1px solid var(--border);
    }
    .chart-sym { font-size:.82rem; font-weight:700; color:var(--text); }
    .chart-tf  { font-size:.72rem; color:var(--text-dim); }
    #chart-el  { width:100%; height:360px; }

    /* ── NARRATION ── */
    .narration {
      border-left:3px solid var(--teal); border-radius:0 8px 8px 0;
      background:rgba(0,212,212,.04);
      padding:14px 18px; font-size:.87rem;
      color:#b4b6d0; line-height:1.8; margin-bottom:14px;
      animation: fadeIn .28s ease;
      backdrop-filter: blur(8px);
    }
    .narration strong { color:var(--text); }

    /* ── QUIZ ── */
    .quiz-q {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:20px 22px; margin-bottom:14px;
      animation:fadeIn .28s ease;
    }
    .quiz-q h3 { font-size:1rem; font-weight:700; margin-bottom:4px; }
    .quiz-hint { font-size:.8rem; color:var(--text-dim); margin-bottom:16px; }
    .quiz-btns { display:flex; gap:12px; flex-wrap:wrap; }
    .qbtn {
      flex:1; min-width:90px; padding:13px 14px;
      border:2px solid; border-radius:8px;
      font-size:.93rem; font-weight:700;
      cursor:pointer; transition:all .14s; background:transparent;
    }
    .qbtn:disabled { opacity:.38; cursor:not-allowed; }
    .qbtn-buy  { border-color:var(--bull); color:var(--bull); background:var(--teal-dim); }
    .qbtn-sell { border-color:var(--bear); color:var(--bear); background:var(--bear-dim); }
    .qbtn-hold { border-color:var(--gold); color:var(--gold); background:var(--gold-dim); }
    .qbtn-buy:hover:not(:disabled)  { background:rgba(0,212,212,.22); box-shadow:0 4px 16px var(--teal-glow); transform:scale(1.03) translateY(-1px); }
    .qbtn-sell:hover:not(:disabled) { background:rgba(204,34,34,.22);  box-shadow:0 4px 16px rgba(204,34,34,.3); transform:scale(1.03) translateY(-1px); }
    .qbtn-hold:hover:not(:disabled) { background:rgba(212,160,23,.22); box-shadow:0 4px 16px rgba(212,160,23,.3); transform:scale(1.03) translateY(-1px); }
    .qbtn.q-correct { background:rgba(0,212,212,.22)!important; border-color:var(--teal)!important; color:var(--teal)!important; box-shadow:0 0 0 3px var(--teal-glow); }
    .qbtn.q-wrong   { background:rgba(204,34,34,.18)!important; border-color:var(--bear)!important; color:var(--bear)!important; }
    .qbtn.q-missed  { border-color:rgba(0,212,212,.45)!important; color:rgba(0,212,212,.55)!important; }

    /* ── RESULT BOX ── */
    .result-box { display:none; border-radius:10px; padding:16px 20px; margin-top:14px; border-left:4px solid; font-size:.87rem; line-height:1.72; animation:fadeIn .2s ease; }
    .result-box.show { display:block; }
    .result-box.r-ok   { border-color:var(--teal); background:rgba(0,212,212,.05); }
    .result-box.r-bad  { border-color:var(--bear);  background:rgba(204,34,34,.05); }
    .result-verdict  { font-size:1.02rem; font-weight:700; margin-bottom:8px; }
    .r-ok  .result-verdict { color:var(--teal); }
    .r-bad .result-verdict { color:var(--bear); }
    .result-box ul { padding-left:18px; color:var(--text-dim); margin-top:6px; }
    .result-box ul li { margin-bottom:4px; }
    .result-box strong { color:var(--text); }
    .retry-btn { margin-top:12px; padding:9px 20px; background:var(--bg4); border:1px solid var(--border2); color:var(--text-dim); border-radius:7px; font-size:.82rem; cursor:pointer; transition:all .14s; }
    .retry-btn:hover { background:var(--bg3); color:var(--text); border-color:var(--border2); }

    /* ── SUMMARY ── */
    .summary-list { list-style:none; padding:0; margin-top:4px; }
    .summary-list li { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:.9rem; color:#c0c2dc; line-height:1.65; }
    .summary-list li:last-child { border-bottom:none; }
    .summary-list li::before { content:'◆'; color:var(--teal); flex-shrink:0; margin-top:3px; font-size:.62rem; }
    .rule-pill { display:inline-block; background:var(--teal-dim); border-left:3px solid var(--teal); border-radius:0 6px 6px 0; padding:7px 12px; margin:5px 0; font-size:.84rem; font-weight:600; color:var(--teal); }

    /* ── NAV ── */
    .nav-row { display:flex; gap:12px; justify-content:flex-end; margin-top:22px; padding-bottom:10px; }
    .btn-nav { padding:12px 26px; border:2px solid; border-radius:8px; font-size:.93rem; font-weight:700; cursor:pointer; transition:all .14s; }
    .btn-next { background:var(--teal); border-color:var(--teal); color:#000; }
    .btn-next:hover { background:#00eeee; box-shadow:0 0 16px rgba(0,212,212,0.4); transform:translateY(-1px); }
    .btn-next .arrow-icon { display:inline-block; transition:transform 0.2s ease; }
    .btn-next:hover .arrow-icon { transform:translateX(4px); }
    .btn-prev { background:transparent; border-color:var(--border2); color:var(--text-dim); opacity: 0.6; }
    .btn-prev:hover { border-color:var(--text-dim); color:var(--text); opacity:1; }

    /* ── WELCOME ── */
    .welcome { text-align:center; padding:64px 16px 40px; animation:fadeIn .4s ease; }
    .w-logo  { font-size:2.8rem; font-weight:900; letter-spacing:5px; color:var(--teal); text-transform:uppercase; text-shadow:0 0 50px var(--teal-glow),0 0 100px rgba(0,212,212,.15); }
    .w-sub   { font-size:.82rem; color:var(--text-dim); letter-spacing:3px; text-transform:uppercase; margin-top:6px; }
    .w-line  { width:72px; height:2px; background:var(--teal); margin:24px auto; box-shadow:0 0 20px var(--teal-glow); }
    .w-desc  { max-width:520px; margin:0 auto 36px; font-size:.93rem; color:#b4b6d0; line-height:1.85; }
    .w-modules { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:560px; margin:0 auto 36px; }
    .w-mod { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:8px 16px; font-size:.78rem; color:var(--text-dim); }
    .w-mod span { color:var(--teal); font-weight:700; }
    .btn-start { display:inline-block; padding:15px 48px; background:var(--teal); color:#000; border:none; border-radius:10px; font-size:1rem; font-weight:800; cursor:pointer; letter-spacing:1px; text-transform:uppercase; transition:all .2s; box-shadow:0 0 30px var(--teal-glow); }
    .btn-start:hover { background:#00eeee; box-shadow:0 0 50px var(--teal-glow); transform:scale(1.04); }

    /* ── CHAPTER CARD ── */
    .chapter-intro-badge { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
    .ch-num { width:52px; height:52px; border-radius:50%; background:var(--teal-dim); border:2px solid var(--teal); display:flex; align-items:center; justify-content:center; font-size:1.2rem; font-weight:900; color:var(--teal); flex-shrink:0; }
    .ch-meta small { display:block; font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
    .ch-meta strong { font-size:1.05rem; font-weight:700; }

    /* ── EXAM ── */
    .exam-hdr { text-align:center; padding:30px 20px 20px; animation:fadeIn .3s ease; }
    .exam-hdr h2 { font-size:1.5rem; font-weight:800; color:var(--teal); }
    .exam-hdr p  { color:var(--text-dim); margin-top:6px; font-size:.9rem; }
    .exam-q-num  { text-align:center; font-size:.78rem; font-weight:700; letter-spacing:2px; color:var(--teal); text-transform:uppercase; margin:8px 0 2px; }

    /* ── CERTIFICATE ── */
    .cert-wrap { display:flex; justify-content:center; padding:40px 16px; animation:fadeIn .4s ease; }
    .cert-box {
      background:linear-gradient(135deg,#0f0f1a,#141425);
      border:2px solid var(--teal); border-radius:18px;
      padding:48px 36px; max-width:520px; width:100%;
      box-shadow:0 0 60px var(--teal-glow),inset 0 0 40px rgba(0,212,212,.03);
      text-align:center; position:relative; overflow:hidden;
    }
    .cert-box::before { content:''; position:absolute; top:0;left:0;right:0; height:2px; background:linear-gradient(90deg,transparent,var(--teal),transparent); }
    .cert-badge { font-size:3.5rem; margin-bottom:16px; }
    .cert-eyebrow { font-size:.7rem; letter-spacing:4px; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
    .cert-brand { font-size:2rem; font-weight:900; color:var(--teal); text-transform:uppercase; letter-spacing:4px; text-shadow:0 0 30px var(--teal-glow); }
    .cert-course-name { font-size:1rem; color:var(--text-dim); margin:8px 0 28px; }
    .cert-complete { font-size:.78rem; letter-spacing:2px; color:var(--text-faint); text-transform:uppercase; margin-bottom:4px; }
    .cert-score { font-size:2.2rem; font-weight:900; color:var(--teal); }
    .cert-score-label { font-size:.75rem; color:var(--text-dim); }
    .cert-divider { width:60px; height:1px; background:var(--border); margin:24px auto; }
    .cert-footer { font-size:.72rem; color:var(--text-faint); }
    .cert-btns { display:flex; gap:12px; justify-content:center; margin-top:28px; flex-wrap:wrap; }
    .cert-btn { padding:12px 28px; border-radius:8px; font-size:.88rem; font-weight:700; cursor:pointer; border:2px solid var(--teal); color:#000; background:var(--teal); transition:all .14s; }
    .cert-btn:hover { background:#00eeee; }
    .cert-btn.outline { background:transparent; color:var(--teal); }
    .cert-btn.outline:hover { background:var(--teal-dim); }

    /* ── FAIL ── */
    .fail-wrap { text-align:center; padding:60px 20px; animation:fadeIn .3s ease; }
    .fail-wrap h2 { font-size:2rem; font-weight:900; color:var(--bear); }
    .fail-wrap p  { color:var(--text-dim); margin:12px 0 32px; font-size:.93rem; max-width:400px; margin-left:auto; margin-right:auto; }
    .fail-score { font-size:3rem; font-weight:900; color:var(--bear); margin:12px 0 4px; }
    .fail-score-lbl { font-size:.8rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:2px; }

    /* ── ANIM ── */
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    @keyframes greenFlash {
      0% { background-color:transparent; }
      35% { background-color:rgba(0,212,212,0.13); }
      100% { background-color:transparent; }
    }
    @keyframes redShake {
      0%,100% { transform:translateX(0); }
      15% { transform:translateX(-7px); background:rgba(204,34,34,0.07); }
      30% { transform:translateX(7px); }
      45% { transform:translateX(-4px); }
      60% { transform:translateX(4px); }
      75% { transform:translateX(-2px); }
    }
    @keyframes burstAnim {
      0% { opacity:0; transform:scale(0.4); }
      45% { opacity:1; transform:scale(1.0); }
      100% { opacity:0; transform:scale(1.6); }
    }
    .flash-correct { animation:greenFlash 0.65s ease forwards; }
    .shake-wrong { animation:redShake 0.5s ease; }

    @keyframes stepFadeIn {
      from { opacity:0; transform:translateY(8px); }
      to { opacity:1; transform:translateY(0); }
    }
    .step-fade { animation:stepFadeIn 0.3s ease; }

    /* ── LT AVATAR ── */
    .lt-avatar { width:32px;height:32px;border-radius:50%;background:rgba(0,212,212,0.12);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:var(--teal);letter-spacing:0.5px;flex-shrink:0;font-family:'Inter',sans-serif; }

    /* ── BRAND UNDERLINE ── */
    .brand-wrap { position:relative;display:inline-block; }
    .brand-underline { position:absolute;bottom:-3px;left:0;height:2px;background:linear-gradient(90deg,var(--teal),#00aaff);box-shadow:0 0 6px rgba(0,212,212,0.4);transition:width 0.5s ease;width:20%; }

    /* ── PROG ROW ── */
    .prog-row { display:flex;align-items:center;gap:8px; }
    .prog-pct { font-size:0.7rem;color:var(--teal);font-weight:700;min-width:32px;text-align:right; }

    /* ── REVIEW BADGE ── */
    .review-badge { display:inline-flex;align-items:center;gap:5px;background:rgba(0,212,212,0.1);border:1px solid var(--teal);color:var(--teal);font-size:0.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px; }

    /* ── SIDEBAR ── */
    .sidebar { position:fixed;top:0;left:0;bottom:0;width:280px;background:rgba(10,10,15,0.98);backdrop-filter:blur(20px);border-right:1px solid var(--border);z-index:200;transform:translateX(-100%);transition:transform 0.3s ease;overflow-y:auto;display:flex;flex-direction:column; }
    .sidebar.open { transform:translateX(0); }
    .sidebar-overlay { position:fixed;inset:0;z-index:199;background:rgba(0,0,0,0.55);display:none;backdrop-filter:blur(2px); }
    .sidebar-overlay.visible { display:block; }
    .sidebar-hdr { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.98); }
    .sidebar-hdr-title { font-size:0.78rem;font-weight:700;color:var(--teal);letter-spacing:1.5px;text-transform:uppercase; }
    .sidebar-close-btn { background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1.1rem;padding:4px 6px;border-radius:4px;transition:color 0.14s; }
    .sidebar-close-btn:hover { color:var(--text); }
    .sidebar-item { display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(37,37,56,0.4);transition:background 0.14s; }
    .sidebar-item.clickable { cursor:pointer; }
    .sidebar-item.clickable:hover { background:rgba(0,212,212,0.05); }
    .sidebar-item.si-current { background:rgba(0,212,212,0.08);border-left:3px solid var(--teal); }
    .sidebar-item.si-locked { opacity:0.3;cursor:default; }
    .si-num { width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;background:var(--bg3);border:1px solid var(--border);color:var(--text-dim); }
    .sidebar-item.si-current .si-num { background:rgba(0,212,212,0.15);border-color:var(--teal);color:var(--teal); }
    .sidebar-item.si-completed .si-num { background:rgba(0,212,212,0.08);border-color:rgba(0,212,212,0.4);color:var(--teal); }
    .si-info { flex:1;min-width:0; }
    .si-name { font-size:0.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .si-status { font-size:0.65rem;color:var(--text-dim);margin-top:2px; }
    .hamburger-btn { background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-size:0.95rem;padding:6px 10px;border-radius:6px;transition:all 0.14s;line-height:1; }
    .hamburger-btn:hover { border-color:var(--teal);color:var(--teal); }

    /* ── JUMP SELECT ── */
    .jump-select { background:var(--bg3);border:1px solid var(--border2);color:var(--text-dim);border-radius:7px;padding:9px 12px;font-size:0.82rem;cursor:pointer;outline:none;transition:border-color 0.14s;font-family:'Inter',sans-serif; }
    .jump-select:hover,.jump-select:focus { border-color:var(--teal); }

    /* ── WELCOME BACK MODAL ── */
    .wb-overlay { position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.87);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.3s ease; }
    .wb-box { background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:36px 32px;max-width:440px;width:100%;box-shadow:0 0 60px rgba(0,212,212,0.15);animation:fadeIn 0.35s ease; }
    .wb-box h2 { font-size:1.4rem;font-weight:800;color:var(--teal);margin-bottom:6px; }
    .wb-subtitle { font-size:0.88rem;color:var(--text-dim);margin-bottom:22px;line-height:1.6; }
    .wb-stats { background:var(--bg3);border-radius:10px;padding:16px;margin-bottom:22px;border:1px solid var(--border); }
    .wb-stat { display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:0.85rem; }
    .wb-stat:last-child { margin-bottom:0; }
    .wb-stat-label { color:var(--text-dim); }
    .wb-stat-value { color:var(--teal);font-weight:700; }
    .wb-btns { display:flex;gap:12px; }

  <script>
  // ── SIDEBAR NAVIGATION ───────────────────────────────────────────────────────
  // Sidebar functions are self-contained; they read from globals set by the
  // course engine (chapIdx, completedChapters/chapsDone) and fall back
  // gracefully if those aren't defined yet.
  // jumpToChapter(i) calls goToChapter(i, true) if the engine exposes it,
  // or dispatches a custom event 'lt:jumpChapter' that the engine can listen to.

  const _SB_TITLES = [
    'Price Action and Candlesticks',
    'Supply and Demand Zones',
    'Support and Resistance',
    'Uptrends and Downtrends',
    'Range-Bound Markets',
    'Market Structure Basics',
    'Swing Points',
    'S/R Flips',
    'High Timeframe Analysis',
    'Low Timeframe Entries',
    'Position Sizing',
    'R Multiples',
    'Kelly Criterion'
  ];

  function renderSidebar() {
    const container = document.getElementById('sidebar-chapters');
    if (!container) return;

    // Read current chapter index from engine global (0-based)
    const curIdx = (typeof chapIdx !== 'undefined') ? chapIdx : -1;

    // Read completed chapters — support Set, Array, or plain object
    const raw = (typeof completedChapters !== 'undefined') ? completedChapters
               : (typeof chapsDone !== 'undefined') ? chapsDone
               : new Set();
    const isDone = raw instanceof Set
      ? i => raw.has(i)
      : Array.isArray(raw)
        ? i => raw.includes(i)
        : i => !!raw[i];

    // Use engine CHAPTERS titles when available, fallback to hardcoded list
    const title = i =>
      (typeof CHAPTERS !== 'undefined' && CHAPTERS[i] && CHAPTERS[i].title)
        ? CHAPTERS[i].title
        : (_SB_TITLES[i] || `Chapter ${i + 1}`);

    const count = (typeof CHAPTERS !== 'undefined') ? CHAPTERS.length : _SB_TITLES.length;

    container.innerHTML = Array.from({length: count}, (_, i) => {
      const isCurrent   = i === curIdx;
      const isCompleted = isDone(i);
      const isLocked    = !isCurrent && !isCompleted;

      let cls = 'sidebar-item';
      let icon, status;
      if (isCurrent) {
        cls += ' si-current'; icon = '▶'; status = 'In Progress';
      } else if (isCompleted) {
        cls += ' si-completed clickable'; icon = '✅'; status = 'Completed';
      } else {
        cls += ' si-locked'; icon = '🔒'; status = 'Locked';
      }

      const click = isCompleted ? `onclick="jumpToChapter(${i})"` : '';
      return `<div class="${cls}" ${click}>
        <div class="si-num">${i + 1}</div>
        <div class="si-info">
          <div class="si-name">${title(i)}</div>
          <div class="si-status">${icon} ${status}</div>
        </div>
      </div>`;
    }).join('');
  }

  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebar-overlay');
    if (sb.classList.contains('open')) {
      closeSidebar();
    } else {
      renderSidebar();
      sb.classList.add('open');
      ov.classList.add('visible');
    }
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('visible');
  }

  function jumpToChapter(i) {
    closeSidebar();
    // If the course engine exposes goToChapter(), call it with review=true
    if (typeof goToChapter === 'function') {
      goToChapter(i, true);
    } else {
      // Fallback: dispatch event the engine can listen to
      document.dispatchEvent(new CustomEvent('lt:jumpChapter', {detail: {idx: i}}));
    }
  }
  </script>

        body:`<p>Not all S/R levels are equally strong. The strength of a level is determined by the <span class="hl">volume of buyers or sellers</span> concentrated there. A level that caused a massive price rejection is stronger than one with a small bounce.</p>
<p>Here's something counterintuitive: <span class="hl-gold">more tests = weaker level</span>. Each time price tests support or resistance, some of those orders get filled. After enough tests, the buyers or sellers at that level run out, and price breaks through. This is the <span class="hl-gold">Rule of Fives</span> — approximately the 5th touch of a level often marks the break.</p>
<p>And when a level does break, something powerful happens: <span class="hl">S/R Flip</span>. When resistance is broken, it becomes new support. When support breaks, it becomes new resistance. Why? Because the same price level that sellers were defending now becomes where buyers defend it, since they know the level has proven significance.</p>
<p>S/R flips are among the <span class="hl">highest-probability trading setups</span> in technical analysis. Learn to recognize them.</p>`
