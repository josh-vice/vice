  <link rel="icon" type="image/svg+xml" href="lt-logo.svg" />

  <!-- SEO / social (carried over from the retired marketing landing — the app IS the site root now) -->
  <meta name="description" content="A free, no-account crypto trading academy. Four interactive courses, a live practice simulator, glossary, flashcards, and interactive labs. Your progress saves automatically." />
  <link rel="canonical" href="https://liqtheory.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Liquidity Theory" />
  <meta property="og:title" content="Liquidity Theory — Learn to Trade Crypto, Free" />
  <meta property="og:description" content="A free, interactive crypto trading academy — 4 courses, a live practice simulator, and real charts. No account needed; your progress saves automatically." />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Liquidity Theory — learn to trade, knowledge freely shared." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Liquidity Theory — Learn to Trade Crypto, Free" />
  <meta name="twitter:description" content="A free, interactive crypto trading academy — 4 courses, a live practice simulator, and real charts. No account needed." />
  <meta name="twitter:image" content="https://liqtheory.com/og-image.png?v=3" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Trimmed: IBM Plex Mono never renders (Cascadia always wins the stack) and
       weight 300 is unused — dropping both cuts the font payload ~40%. -->
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="lt-styles.css?v=1.118.0" />
  <!-- v2 animated-lessons player chrome (scoped to .ltp2*; see lessons-v2/) -->
  <link rel="stylesheet" href="lessons-v2/player.css?v=1.20.0" />

  <!-- CDN deps — pinned exact versions + SRI so a compromised/drifting CDN can't
       inject code. To upgrade: bump the version, re-download, recompute
       `openssl dgst -sha384 -binary file | openssl base64 -A`. -->
  <!-- ECharts (chart rendering) -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"
          integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss"
          crossorigin="anonymous" defer></script>

  <!-- Lucide icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.23.0/dist/umd/lucide.min.js"
          integrity="sha384-ouAVEJVCMsf8Svzn+BwqbaBhxBEA0xgeVBhHnxmWd+Wqyv18yhWCQwGegFD/OHLq"
          crossorigin="anonymous" defer></script>

  <!-- Cross-device progress sync: LZ-String (compact link) + QRCode (scan to transfer).
       Client-side only — the progress lives in the link's #fragment; nothing is uploaded. -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"
          integrity="sha384-0d+Gr7vM4Drod8E3hXKgciWJSWbjD/opKLLygI9ktiWbuvlDwQLzU46wJ9s5gsp7"
          crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a0708418cb7b96fc563eacae0fbf77674/qrcode.min.js"
          integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU"
          crossorigin="anonymous" defer></script>

  <!-- Persistence facade: ONE registry of every fixed localStorage key + safe
       accessors. Must load before lt-settings.js (reads prefs at parse time). -->
  <script src="lt-store.js?v=1.2.0"></script>

  <!-- Settings load SYNCHRONOUSLY right after the store: ltApplySavedSettings() runs at
       parse time and sets the theme/palette CSS vars BEFORE first paint (no flash).
       Everything below is deferred — order-preserving, so the parse-time dependency
       chain (chartgen → data → engine) is unchanged, but nothing blocks rendering. -->
  <script src="lt-settings.js?v=1.38.2"></script>

  <!-- Technical-analysis math (Ichimoku / RSI / CVD / volume). The engine delegates
       its indicator helpers here; must load before lt-engine.js. -->
  <script src="lt-ta.js?v=1.1.0" defer></script>

  <!-- Canonical data-viz palette (engine VIZ/RED/GOLD/TEAL2 alias to this). -->
  <script src="lt-tokens.js?v=1.0.0" defer></script>

  <!-- Pure colour / number-format helpers (engine helpers delegate here). -->
  <script src="lt-utils.js?v=1.2.0" defer></script>

  <!-- Teaching-candle generator (data files call ltCandles() at parse time) -->
  <script src="lt-chartgen.js?v=1.2.0" defer></script>

  <!-- Data files MUST load before lt-engine.js (engine reads LT_CHAPTERS at parse time) -->
  <script src="lt-data.js?v=1.18.2" defer></script>
  <script src="lt-data-course2.js?v=1.22.0" defer></script>
  <script src="lt-data-course3.js?v=1.20.0" defer></script>
  <script src="lt-data-course4.js?v=1.27.0" defer></script>

  <!-- Module quizzes — multi-question end-of-module "Learning Assessment" (the Quiz step) -->
  <script src="lt-module-quizzes.js?v=1.0.5" defer></script>

  <!-- Real historical pattern definitions -->
  <script src="lt-patterns.js?v=1.5.0" defer></script>

  <!-- Synthetic market generator + live BTC data feed -->
  <script src="lt-simulator.js?v=1.5.0" defer></script>
  <script src="lt-sim-feed.js?v=1.3.0" defer></script>

  <!-- UI modules (loaded before engine so engine can call them) -->
  <script src="lt-gallery.js?v=2.0.1" defer></script>
  <script src="lt-orderbook.js?v=1.5.1" defer></script>
  <script src="lt-patternlib.js?v=1.1.1" defer></script>
  <script src="lt-ichimoku.js?v=1.3.1" defer></script>
  <script src="lt-fib.js?v=1.3.1" defer></script>
  <script src="lt-msbuilder.js?v=1.1.1" defer></script>
  <script src="lt-divtrainer.js?v=1.0.1" defer></script>
  <script src="lt-volreader.js?v=1.0.1" defer></script>
  <script src="lt-tradingview.js?v=1.0.1" defer></script>
  <script src="lt-sim-ui.js?v=3.9.1" defer></script>
  <script src="lt-glossary.js?v=2.2.1" defer></script>
  <script src="lt-flashcards.js?v=1.9.10" defer></script>
  <script src="lt-community.js?v=2.0.2" defer></script>

  <!-- v2 animated-lessons stack (dependency-free): vocabulary + Canvas renderer + lesson-file
       manifest. THE lesson renderer (engine maps each chapter → a v2 lesson; lesson files
       lazy-load per course via window.LT_V2_FILES). Must load before the deferred engine. -->
  <script src="lessons-v2/chart-vocabulary.js?v=1.14.0" defer></script>
  <script src="lessons-v2/renderer.js?v=1.29.0" defer></script>
  <script src="lessons-v2/lessons/manifest.js?v=1.1.1" defer></script>
  <!-- which lessons have pre-generated narration audio (window.LT_AUDIO_MANIFEST) -->
  <script src="lessons-v2/audio/manifest.js?v=2.0.0" defer></script>

  <!-- Main engine — boots on DOMContentLoaded -->
  <script src="lt-engine.js?v=3.152.1" defer></script>
  <!-- Vercel Analytics -->
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

      <i data-lucide="home" style="width:16px;height:16px;"></i>
      <span>Home</span>
    </button>

    <!-- Legacy course-select (hidden — engine hides it, but the element must exist) -->

    <!-- Chapter list (engine builds this via buildSidebar()) -->
