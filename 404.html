<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Vice Terminal</title>
  <meta name="robots" content="noindex" />
  <style>
    /* Self-contained on purpose: this file serves every host on the project,
       so it carries its own styles and loads nothing external. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #08070f; color: #f6f5fb;
      font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      -webkit-font-smoothing: antialiased; padding: 24px;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(900px 480px at 82% -10%, rgba(0, 212, 212, 0.10), transparent 60%),
        radial-gradient(820px 540px at 8% 4%, rgba(255, 46, 136, 0.08), transparent 58%),
        linear-gradient(rgba(168, 120, 220, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 120, 220, 0.03) 1px, transparent 1px);
      background-size: auto, auto, 44px 44px, 44px 44px;
    }
    main { position: relative; z-index: 1; max-width: 460px; text-align: center; }
    .code {
      font-size: clamp(64px, 16vw, 96px); font-weight: 800; letter-spacing: -0.02em;
      line-height: 1; color: #f6f5fb;
    }
    .code b { color: #00d4d4; font-weight: 800; }
    .line { margin-top: 14px; color: #a8a3bb; font-size: 14px; line-height: 1.6; }
    .line code {
      font-family: inherit; font-size: 12.5px; color: #8b85a3;
      background: #0d0b18; border: 1px solid #272235; border-radius: 4px; padding: 1px 7px;
    }
    .links { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .links a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border: 1px solid #4b4566; border-radius: 6px;
      color: #f6f5fb; text-decoration: none; font-size: 13px; font-weight: 600;
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .links a:hover { border-color: #00d4d4; box-shadow: 0 0 20px rgba(0, 212, 212, 0.22); }
    .links a:active { transform: scale(0.97); }
    .links a.pink:hover { border-color: #ff2e88; box-shadow: 0 0 20px rgba(255, 46, 136, 0.24); }
    .links a:focus-visible { outline: 2px solid #00d4d4; outline-offset: 2px; }
    .foot { margin-top: 34px; color: #8b85a3; font-size: 11.5px; }
    .foot b { color: #ff2e88; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { .links a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="code">4<b>0</b>4</div>
    <p class="line">Nothing charted here — the page you're after doesn't exist,
    or the level got swept. <code>no data at this address</code></p>
    <div class="links">
      <a href="https://vicesuite.com/">Vice Suite — bots &amp; the Hub</a>
      <a class="pink" href="https://liqtheory.com/">Vice Academy — learn to trade</a>
    </div>
    <p class="foot">A <b>Vice Terminal</b> property</p>
  </main>
</body>
</html>
