<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Pattern Quiz</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #f0f6fc;
    }
    header p {
      margin-top: 6px;
      font-size: 0.92rem;
      color: #8b949e;
    }

    .ticker-bar {
      display: flex;
      gap: 24px;
      align-items: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 20px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #8b949e;
    }
    .ticker-bar .symbol { font-weight: 700; font-size: 1rem; color: #f0f6fc; }
    .ticker-bar .price { font-size: 1.1rem; font-weight: 600; color: #3fb950; }
    .ticker-bar .change { color: #3fb950; }

    .chart-wrapper {
      width: 100%;
      max-width: 820px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #chart {
      width: 100%;
      height: 420px;
    }

    .question-card {
      width: 100%;
      max-width: 820px;
      margin-top: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 22px 24px;
    }

    .question-card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #c9d1d9;
      margin-bottom: 6px;
    }
    .question-card p.hint {
      font-size: 0.82rem;
      color: #6e7681;
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 100px;
      padding: 13px 16px;
      border: 2px solid transparent;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-buy {
      background: rgba(63, 185, 80, 0.12);
      border-color: #3fb950;
      color: #3fb950;
    }
    .btn-buy:hover:not(:disabled) {
      background: rgba(63, 185, 80, 0.25);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(63, 185, 80, 0.2);
    }

    .btn-sell {
      background: rgba(248, 81, 73, 0.12);
      border-color: #f85149;
      color: #f85149;
    }
    .btn-sell:hover:not(:disabled) {
      background: rgba(248, 81, 73, 0.25);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(248, 81, 73, 0.2);
    }

    .btn-hold {
      background: rgba(210, 153, 34, 0.12);
      border-color: #d29922;
      color: #d29922;
    }
    .btn-hold:hover:not(:disabled) {
      background: rgba(210, 153, 34, 0.25);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(210, 153, 34, 0.2);
    }

    /* Answered states */
    .btn.correct {
      background: rgba(63, 185, 80, 0.3) !important;
      border-color: #3fb950 !important;
      color: #3fb950 !important;
      box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.25);
    }
    .btn.wrong {
      background: rgba(248, 81, 73, 0.2) !important;
      border-color: #f85149 !important;
      color: #f85149 !important;
    }
    .btn.missed {
      background: rgba(63, 185, 80, 0.15) !important;
      border-color: rgba(63, 185, 80, 0.5) !important;
      color: rgba(63, 185, 80, 0.7) !important;
    }

    .result-box {
      display: none;
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.6;
      border-left: 4px solid transparent;
    }
    .result-box.show { display: block; }
    .result-box.correct-result {
      background: rgba(63, 185, 80, 0.08);
      border-color: #3fb950;
    }
    .result-box.wrong-result {
      background: rgba(248, 81, 73, 0.08);
      border-color: #f85149;
    }

    .result-box .verdict {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .result-box.correct-result .verdict { color: #3fb950; }
    .result-box.wrong-result .verdict { color: #f85149; }

    .result-box ul {
      padding-left: 16px;
      color: #8b949e;
      margin-top: 6px;
    }
    .result-box ul li { margin-bottom: 3px; }
    .result-box strong { color: #c9d1d9; }

    .try-again {
      display: none;
      margin-top: 14px;
      padding: 10px 22px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 7px;
      color: #8b949e;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .try-again:hover {
      background: #30363d;
      color: #c9d1d9;
    }
    .try-again.show { display: inline-block; }

    footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #484f58;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>📈 Trading Pattern Quiz</h1>
    <p>Study the chart below — what's the right move?</p>
  </header>

  <div class="ticker-bar">
    <span class="symbol">OCLW</span>
    <span class="price">$103.40</span>
    <span class="change">▲ +8.84 (+9.35%)</span>
    <span style="margin-left:auto;">Daily · 19 candles</span>
  </div>

  <div class="chart-wrapper">
    <div id="chart"></div>
  </div>

  <div class="question-card">
    <h2>What should you do based on this pattern?</h2>
    <p class="hint">Look for consolidation zones, resistance levels, and volume signals.</p>

    <div class="buttons">
      <button class="btn btn-buy"  id="btn-buy"  onclick="answer('buy')">🟢 Buy</button>
      <button class="btn btn-sell" id="btn-sell" onclick="answer('sell')">🔴 Sell</button>
      <button class="btn btn-hold" id="btn-hold" onclick="answer('hold')">🟡 Hold / Wait</button>
    </div>

    <div class="result-box" id="result-box">
      <div class="verdict" id="verdict-text"></div>
      <div id="explanation"></div>
    </div>

    <button class="try-again" id="try-again" onclick="reset()">↺ Try Again</button>
  </div>

  <footer>For educational purposes only. Not financial advice.</footer>

<script>
  // ── Chart Data ────────────────────────────────────────────────────────────
  // Each candle: [open, close, low, high]  (ECharts candlestick format)
  // Resistance zone: ~96–97. Breakout on final candle.

  const labels = [
    'May 1','May 2','May 5','May 6','May 7',
    'May 8','May 9','May 12','May 13','May 14',
    'May 15','May 16','May 19','May 20','May 21',
    'May 22','May 23','May 26','May 27'
  ];

  // [open, close, low, high]
  const rawOHLC = [
    [110, 105, 103, 112],  // downtrend
    [106,  99,  97, 107],
    [100,  94,  92, 101],
    [ 95,  91,  89,  96],
    [ 91,  88,  86,  93],
    // consolidation — bounded between ~87 and ~97
    [ 88,  93,  86,  95],
    [ 93,  90,  88,  95],
    [ 90,  94,  88,  96],
    [ 94,  91,  88,  96],
    [ 91,  93,  88,  95],
    [ 93,  89,  87,  95],
    [ 89,  93,  87,  96],
    [ 93,  91,  88,  96],
    [ 91,  94,  89,  96],
    [ 94,  93,  90,  97],
    // pressure builds
    [ 93,  95,  91,  97],
    [ 95,  94,  92,  97],
    [ 94,  96,  92,  97],
    // BREAKOUT — big bullish candle above resistance
    [ 96, 103,  95, 104],
  ];

  const volumes = [
    3200, 2900, 3100, 2800, 2600,
    1800, 1600, 1700, 1500, 1600,
    1400, 1550, 1600, 1500, 1650,
    1700, 1800, 2100,
    5800,  // breakout candle — volume spike
  ];

  // ── Build ECharts ──────────────────────────────────────────────────────────
  const chartEl = document.getElementById('chart');
  const myChart = echarts.init(chartEl, 'dark');

  const upColor   = '#3fb950';
  const downColor = '#f85149';

  const option = {
    backgroundColor: '#161b22',
    animation: true,
    animationDuration: 800,
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      backgroundColor: '#1c2128',
      borderColor: '#30363d',
      textStyle: { color: '#c9d1d9', fontSize: 12 },
      formatter: function(params) {
        const c = params.find(p => p.seriesName === 'Price');
        const v = params.find(p => p.seriesName === 'Volume');
        if (!c) return '';
        const [o, cl, lo, hi] = c.data;
        const pct = (((cl - o) / o) * 100).toFixed(2);
        const sign = cl >= o ? '+' : '';
        return `
          <b style="color:#f0f6fc">${labels[c.dataIndex]}</b><br/>
          O: ${o} &nbsp; C: <span style="color:${cl>=o?upColor:downColor}">${cl}</span><br/>
          H: ${hi} &nbsp; L: ${lo}<br/>
          Change: <span style="color:${cl>=o?upColor:downColor}">${sign}${pct}%</span><br/>
          Vol: ${v ? v.data.toLocaleString() : '—'}
        `;
      }
    },
    axisPointer: {
      link: [{ xAxisIndex: 'all' }]
    },
    grid: [
      { left: 56, right: 24, top: 24, bottom: 120 },
      { left: 56, right: 24, top: 340, bottom: 30 }
    ],
    xAxis: [
      {
        type: 'category',
        data: labels,
        gridIndex: 0,
        axisLine: { lineStyle: { color: '#30363d' } },
        axisLabel: { color: '#6e7681', fontSize: 11 },
        splitLine: { show: false }
      },
      {
        type: 'category',
        data: labels,
        gridIndex: 1,
        axisLine: { lineStyle: { color: '#30363d' } },
        axisLabel: { show: false },
        splitLine: { show: false }
      }
    ],
    yAxis: [
      {
        scale: true,
        gridIndex: 0,
        splitLine: { lineStyle: { color: '#21262d', type: 'dashed' } },
        axisLine: { lineStyle: { color: '#30363d' } },
        axisLabel: { color: '#6e7681', fontSize: 11, formatter: v => '$' + v }
      },
      {
        scale: true,
        gridIndex: 1,
        splitLine: { show: false },
        axisLine: { lineStyle: { color: '#30363d' } },
        axisLabel: { color: '#6e7681', fontSize: 10 }
      }
    ],
    series: [
      {
        name: 'Price',
        type: 'candlestick',
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: rawOHLC,
        itemStyle: {
          color: upColor,
          color0: downColor,
          borderColor: upColor,
          borderColor0: downColor,
          borderWidth: 1.5
        },
        markLine: {
          symbol: 'none',
          silent: true,
          lineStyle: { type: 'dashed', color: '#d29922', width: 1.5, opacity: 0.8 },
          label: {
            position: 'end',
            color: '#d29922',
            fontSize: 11,
            formatter: 'Resistance ~$96–97'
          },
          data: [{ yAxis: 96.5 }]
        },
        markArea: {
          silent: true,
          itemStyle: { color: 'rgba(210,153,34,0.04)', borderColor: 'rgba(210,153,34,0.15)', borderWidth: 1 },
          data: [[{ yAxis: 87 }, { yAxis: 97 }]]
        }
      },
      {
        name: 'Volume',
        type: 'bar',
        xAxisIndex: 1,
        yAxisIndex: 1,
        data: volumes.map((v, i) => ({
          value: v,
          itemStyle: {
            color: rawOHLC[i][1] >= rawOHLC[i][0]
              ? 'rgba(63,185,80,0.6)'
              : 'rgba(248,81,73,0.5)'
          }
        })),
        barMaxWidth: 14
      }
    ]
  };

  myChart.setOption(option);
  window.addEventListener('resize', () => myChart.resize());

  // ── Quiz Logic ─────────────────────────────────────────────────────────────
  const CORRECT = 'buy';

  const explanations = {
    buy: {
      correct: true,
      verdict: '✅ Correct! That\'s a textbook breakout.',
      html: `
        <p>You spotted it right. Here's what the chart showed:</p>
        <ul>
          <li><strong>Prior downtrend</strong> established bearish momentum</li>
          <li><strong>Consolidation phase</strong> (days 6–18): price coiled between ~$87 support and ~$97 resistance</li>
          <li><strong>Decreasing volume</strong> during the base — classic energy compression</li>
          <li><strong>Breakout candle</strong> (day 19): closed at <strong>$103</strong>, decisively above the $96–97 resistance zone</li>
          <li><strong>Volume surge</strong> on the breakout confirms conviction — institutions stepping in</li>
        </ul>
        <p style="margin-top:8px;color:#3fb950;">📌 Entry on breakout confirmation, stop-loss below the breakout candle low (~$95).</p>
      `
    },
    sell: {
      correct: false,
      verdict: '❌ Not quite.',
      html: `
        <p>Selling here would be fighting the momentum. Look again:</p>
        <ul>
          <li>The last candle <strong>broke out above resistance at $96–97</strong> with a strong close at $103</li>
          <li><strong>Volume spiked sharply</strong> — that's buying pressure, not distribution</li>
          <li>Shorting into a confirmed breakout is high-risk and counter-trend</li>
        </ul>
        <p style="margin-top:8px;color:#3fb950;">✅ The correct answer was <strong>Buy</strong> — breakout with volume confirmation.</p>
      `
    },
    hold: {
      correct: false,
      verdict: '⚠️ Close, but you missed an opportunity.',
      html: `
        <p>Waiting during the consolidation was smart — but the signal just fired:</p>
        <ul>
          <li>The breakout candle <strong>closed above $96–97 resistance</strong> decisively</li>
          <li><strong>Volume exploded</strong> on the breakout bar — confirmation signal</li>
          <li>"Hold/Wait" was correct <em>before</em> this candle, not after</li>
          <li>Waiting for a retest of $97 as new support is valid — but missing the initial breakout is a missed entry</li>
        </ul>
        <p style="margin-top:8px;color:#3fb950;">✅ The correct answer was <strong>Buy</strong> — the breakout is confirmed, not pending.</p>
      `
    }
  };

  function answer(choice) {
    const info = explanations[choice];
    const resultBox = document.getElementById('result-box');
    const verdictEl = document.getElementById('verdict-text');
    const explEl    = document.getElementById('explanation');

    // Disable all buttons
    ['buy','sell','hold'].forEach(id => {
      document.getElementById('btn-' + id).disabled = true;
    });

    // Style the clicked button
    const clickedBtn = document.getElementById('btn-' + choice);
    clickedBtn.classList.add(info.correct ? 'correct' : 'wrong');

    // If wrong, highlight the correct one
    if (!info.correct) {
      document.getElementById('btn-' + CORRECT).classList.add('missed');
    }

    // Show result
    verdictEl.textContent = info.verdict;
    explEl.innerHTML = info.html;
    resultBox.className = 'result-box show ' + (info.correct ? 'correct-result' : 'wrong-result');

    // Show try again
    document.getElementById('try-again').classList.add('show');

    // Highlight breakout on chart
    highlightBreakout();
  }

  function highlightBreakout() {
    myChart.setOption({
      series: [{
        name: 'Price',
        markPoint: {
          symbolSize: 40,
          label: { color: '#f0f6fc', fontSize: 10, fontWeight: 'bold' },
          data: [{
            name: 'Breakout!',
            coord: [labels[labels.length - 1], 104],
            symbol: 'arrow',
            symbolSize: 18,
            symbolRotate: 180,
            label: {
              show: true,
              formatter: 'Breakout!',
              position: 'top',
              color: '#3fb950',
              fontSize: 11,
              fontWeight: 'bold'
            },
            itemStyle: { color: '#3fb950' }
          }]
        }
      }]
    });
  }

  function reset() {
    ['buy','sell','hold'].forEach(id => {
      const btn = document.getElementById('btn-' + id);
      btn.disabled = false;
      btn.classList.remove('correct','wrong','missed');
    });

    const resultBox = document.getElementById('result-box');
    resultBox.className = 'result-box';
    document.getElementById('try-again').classList.remove('show');

    // Remove markPoint
    myChart.setOption({
      series: [{ name: 'Price', markPoint: { data: [] } }]
    });
  }
</script>
</body>
</html>
