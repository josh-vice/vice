name: ci

on:
  pull_request:
  push:
    branches:
      - viceterminal
      - main

# Least privilege: CI never signs, trades, publishes, or needs wallet
# credentials. contents: read is all a clean-checkout gate requires; no token
# is minted for publish/deploy steps (they are deliberately absent here).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Static source checks (clean checkout, pinned toolchain) -----------
  source-checks:
    name: Source checks (preflight / typecheck / svelte / audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Frozen install (lockfile-pinned)
        run: bun install --frozen-lockfile
      - name: Cache Bun install (lockfile-keyed)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-
      - name: Custody + release policy preflight
        run: bun run preflight
      - name: Dependency audit + lockfile-in-sync
        run: bun run test:audit
      - name: TypeScript source typecheck
        run: bun run typecheck
      - name: Svelte check
        run: bun run test:svelte

  # ---- Frontend unit / policy / contract suites (deterministic, no venue) --
  frontend-tests:
    name: Frontend suites (unit/policy/contract/chaos/revenue/mobile/load)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Cache Bun install (lockfile-keyed)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-
      - name: Core frontend suite
        run: bun run test:frontend
      - name: Catalog / market identity
        run: bun run test:catalog
      - name: Contract boundaries
        run: bun run test:contract
      - name: Chaos / reconciliation
        run: bun run test:chaos
      - name: Revenue surface
        run: bun run test:revenue
      - name: Mobile parity
        run: bun run test:mobile
      - name: Load / latency gates
        run: bun run test:load
      - name: Story schema + widget catalog
        run: bun run test:stories && bun run test:widgets
      - name: Security-boundary workflow lint (local equivalent)
        run: bun run test:workflow-boundary

  # ---- Backend (Rust gateway) contract tests -----------------------------
  backend-tests:
    name: Backend contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Cache Cargo (Cargo.lock-keyed)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vice-backend/target
          key: cargo-${{ hashFiles('vice-backend/Cargo.lock') }}
          restore-keys: |
            cargo-
      - name: Backend contract tests
        run: bun run test:backend

  # ---- Production build + artifact boundary scan ---------------------------
  # Builds the real deploy artifact and proves the SERVED static output is
  # bounded (no internal source/signer/credential/evidence tree leaks) via the
  # same pwa-artifact boundary test that guards releases.
  build:
    name: Production build + artifact boundary scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Cache Bun install (lockfile-keyed)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-
      - name: Production build (site + terminal)
        run: bun run build
      - name: PWA artifact boundary scan
        run: bun run test:pwa

  # ---- Production hydrated E2E (no credentials) ----------------------------
  # Boots a real Chromium against the production build/preview and runs the
  # non-mutating suite (test:e2e). Requires only public testnet reads — never
  # signs, never places/modifies/cancels an order, never needs a wallet. The
  # venue-mutating funded suite is NOT run here (it needs explicit env gates).
  browser-e2e:
    name: Production hydrated Chromium E2E (non-mutating)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build]
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Install Chromium (Playwright)
        run: bunx playwright install --with-deps chromium
      - name: Run non-mutating hydrated E2E suite
        env:
          VITE_HL_NETWORK: testnet
        run: bun run test:e2e

  # ---- Deterministic runtime tests that do NOT mutate a venue -------------
  # Bounded read-only smoke + SSR/browser-surface policy checks against the
  # locally-started stack. These never place/modify/cancel an order, never
  # sign, and never need wallet credentials.
  runtime-smoke:
    name: Runtime smoke + browser surface (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VICE_BACKEND_PORT: 8081
      VICE_BACKEND_URL: http://127.0.0.1:8081
      VICE_FRONTEND_URL: http://localhost:5173
      VITE_HL_NETWORK: testnet
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Cache Cargo (Cargo.lock-keyed)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vice-backend/target
          key: cargo-${{ hashFiles('vice-backend/Cargo.lock') }}
          restore-keys: |
            cargo-
      - name: Start owned stack and run read-only runtime smoke
        run: bash scripts/dev-verify.sh
  # ---- Required aggregation gate ------------------------------------------
  # Parallel jobs remain independent for throughput; this job is the single
  # required status that proves the complete CI composition before promotion.
  required-gate:
    name: Required release-gate aggregation
    if: always()
    needs: [source-checks, frontend-tests, backend-tests, build, browser-e2e, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel gate
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.source-checks.result }}" \
            "${{ needs.frontend-tests.result }}" \
            "${{ needs.backend-tests.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.browser-e2e.result }}" \
            "${{ needs.runtime-smoke.result }}"; do
            test "$result" = success || { echo "::error::parallel release gate result=$result"; exit 1; }
          done
